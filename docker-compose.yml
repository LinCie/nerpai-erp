services:
  migrations:
    build:
      context: .
      dockerfile: .docker/migrations/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/nerpai}

  app:
    build:
      context: .
      dockerfile: .docker/app/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@db:5432/nerpai}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-default-dev-secret-change-in-production}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    depends_on:
      migrations:
        condition: service_completed_successfully
